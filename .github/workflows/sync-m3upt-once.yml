name: Sync M3UPT snapshot once

on:
  push:
    paths:
      - .github/workflows/sync-m3upt-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream M3UPT snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contrib/livetv-core/fixtures
          url="https://raw.githubusercontent.com/LITUATUI/M3UPT/main/M3U/M3UPT.m3u"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 "$url" -o contrib/livetv-core/fixtures/M3UPT.m3u
          upstream_commit="$(git ls-remote https://github.com/LITUATUI/M3UPT.git refs/heads/main | awk '{print $1}')"
          sha256="$(sha256sum contrib/livetv-core/fixtures/M3UPT.m3u | awk '{print $1}')"
          bytes="$(wc -c < contrib/livetv-core/fixtures/M3UPT.m3u | tr -d ' ')"
          channels="$(grep -c '^#EXTINF:' contrib/livetv-core/fixtures/M3UPT.m3u || true)"
          fetched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > contrib/livetv-core/fixtures/M3UPT.meta.json <<EOF
          {
            "source": "$url",
            "upstreamRepository": "https://github.com/LITUATUI/M3UPT",
            "upstreamCommit": "$upstream_commit",
            "sha256": "$sha256",
            "bytes": $bytes,
            "extinfEntries": $channels,
            "fetchedAt": "$fetched_at"
          }
          EOF

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib/livetv-core/fixtures/M3UPT.m3u contrib/livetv-core/fixtures/M3UPT.meta.json
          if git diff --cached --quiet; then
            echo "Snapshot already current"
            exit 0
          fi
          git commit -m "Embed current M3UPT playlist snapshot"
          git push origin HEAD:main
