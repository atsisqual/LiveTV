name: Android debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Shaka Player
        run: npm install --no-audit --no-fund

      - name: Prepare bundled Shaka and M3UPT assets
        run: python3 scripts/prepare-assets.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate package
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.atsisqual.livetv.shaka'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-Shaka-Test-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
