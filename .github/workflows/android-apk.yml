name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'contrib/livetv-core/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install LiveTV playback core
        working-directory: contrib/livetv-core
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Check playback and Android layers
        working-directory: contrib/livetv-core
        run: npm run check

      - name: Test playback core
        working-directory: contrib/livetv-core
        run: npm test

      - name: Apply Android v0.9 player layer
        run: node contrib/livetv-core/android/v070-build-patch.mjs

      - name: Bundle Android web player
        working-directory: contrib/livetv-core
        run: |
          mkdir -p ../../android/app/src/main/assets
          cp android/index.html ../../android/app/src/main/assets/index.html
          npx esbuild android/app.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=chrome100 \
            --loader:.m3u=text \
            --outfile=../../android/app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.atsisqual.livetv.shaka'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='0.9.0'"
          cp "$APK" LiveTV-Android-Test-v0.9.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-Android-Test-v0.9.0
          path: LiveTV-Android-Test-v0.9.0.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-test-v0.9.0
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LiveTV Android Test v0.9.0" --notes "Player UI and interactions reimplemented from analysis of the provided decompiled reference app: 48dp operator controls, 280dp side drawer, 76dp recent-channel cards, matching dark/accent palette, draggable drawer, swipe-up/right-edge channel access, swipe-to-unlock, live-edge action, and DVR scrub tooltip. Playback backend remains Video.js 10 + HLS/Shaka with M3UPT." --prerelease
          gh release upload "$TAG" LiveTV-Android-Test-v0.9.0.apk --clobber
