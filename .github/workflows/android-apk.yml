name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'contrib/livetv-core/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install LiveTV playback core
        working-directory: contrib/livetv-core
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Test playback core
        working-directory: contrib/livetv-core
        run: npm test

      - name: Bundle Android web player
        working-directory: contrib/livetv-core
        run: |
          mkdir -p ../../android/app/src/main/assets
          cp android/index.html ../../android/app/src/main/assets/index.html
          npx esbuild android/app.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=chrome100 \
            --loader:.m3u=text \
            --outfile=../../android/app/src/main/assets/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.atsisqual.livetv.shaka'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='0.2.0'"
          cp "$APK" LiveTV-Android-Test-v0.2.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-Android-Test-v0.2.0
          path: LiveTV-Android-Test-v0.2.0.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-test-v0.2.0
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LiveTV Android Test v0.2.0" --notes "Android test build: embedded M3UPT, Video.js 10 HLS adapter, Shaka fallback for DASH/DRM, native WebView request headers." --prerelease
          gh release upload "$TAG" LiveTV-Android-Test-v0.2.0.apk --clobber

# touch: ensure the Android build is triggered from the LiveTV repository
