name: Bootstrap Video.js base

on:
  push:
    branches: [ bootstrap/videojs-import ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve LiveTV backend overlay
        run: |
          rm -rf /tmp/livetv-overlay
          mkdir -p /tmp/livetv-overlay/contrib
          cp -a .bootstrap-overlay/contrib/livetv-core /tmp/livetv-overlay/contrib/
          cp .bootstrap-overlay/LIVETV.md /tmp/livetv-overlay/LIVETV.md

      - name: Fetch Video.js upstream with history
        run: |
          git remote remove videojs 2>/dev/null || true
          git remote add videojs https://github.com/videojs/video.js.git
          git fetch videojs main --tags

      - name: Rebase main onto Video.js and apply LiveTV backend
        run: |
          git config user.name "atsisqual"
          git config user.email "327089646+atsisqual@users.noreply.github.com"
          git checkout -B main videojs/main
          cp -a /tmp/livetv-overlay/. .
          git add LIVETV.md contrib/livetv-core
          git commit -m "Add LiveTV robust playback backend on Video.js"

      - name: Validate LiveTV playback core
        working-directory: contrib/livetv-core
        run: |
          npm run check
          npm test

      - name: Import Video.js history into main
        run: |
          git push origin main --force
