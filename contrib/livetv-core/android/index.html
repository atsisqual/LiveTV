<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiveTV Android</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0c0d0f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;flex-direction:column}.top{padding:14px 16px 10px;background:#14161a;position:sticky;top:0;z-index:5}.title{font-size:20px;font-weight:750}.sub{font-size:12px;color:#aeb4bd;margin-top:2px}.tools{display:flex;gap:8px;margin-top:10px}.tools input,.tools select{min-width:0;background:#20242a;color:#fff;border:1px solid #353b44;border-radius:10px;padding:10px}.tools input{flex:1}.main{display:grid;grid-template-columns:minmax(250px,34%) 1fr;min-height:0;flex:1}.list{overflow:auto;border-right:1px solid #282c33}.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:0;border-bottom:1px solid #20242a;background:transparent;color:#fff;text-align:left}.row:active,.row.active{background:#242932}.logo{width:50px;height:34px;object-fit:contain;background:#fff;border-radius:5px}.info{min-width:0;flex:1}.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:11px;color:#99a0aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player{min-width:0;background:#000;display:flex;flex-direction:column}.videoWrap{position:relative;flex:1;min-height:250px;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;max-height:100%;background:#000}.status{padding:8px 12px;background:#121418;color:#c6ccd5;font-size:12px;min-height:36px}.error{color:#ff8b8b}@media(max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:44% 56%}.list{border-right:0;border-bottom:1px solid #282c33}.player{min-height:0}.videoWrap{min-height:0}.top{padding-top:max(12px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<div class="top"><div class="title">LiveTV Android</div><div class="sub" id="summary">A carregar lista embebida…</div><div class="tools"><input id="search" placeholder="Pesquisar canal"><select id="group"><option value="">Todos</option></select></div></div>
<div class="main"><div id="list" class="list"></div><div class="player"><div class="videoWrap"><video id="video" controls playsinline></video></div><div id="status" class="status">Seleciona um canal.</div></div></div>
<script src="app.js"></script>
</body>
</html>
