<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiveTV</title>
<style>
:root{color-scheme:dark;--bg:#050607;--panel:#17191d;--panel2:#202329;--soft:#a6a8ad;--accent:#79caff;--white:#f7f7f8}*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:92px}.shell{width:100%;max-width:900px;margin:0 auto}.appHeader{height:76px;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 20px 12px;background:#000;position:relative;z-index:4}.headerLeft,.headerActions{display:flex;align-items:center;gap:14px}.avatar{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:15px;font-weight:900}.pageTitle{font-size:27px;font-weight:760;letter-spacing:-.03em}.iconBtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:26px;display:grid;place-items:center}.iconBtn:active{background:#24262b}.hero{position:relative;background:#000;overflow:hidden}.hero live-video-player,.hero live-video-skin{display:block;width:100%}.hero live-video-skin{aspect-ratio:16/9;background:#000}.hero video{width:100%;height:100%;background:#000}.heroShade{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.84));pointer-events:none;z-index:2}.heroInfo{position:absolute;left:24px;right:72px;bottom:25px;z-index:3;pointer-events:none}.livePill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.liveDot{width:8px;height:8px;border-radius:50%;background:#ff3348;box-shadow:0 0 0 4px rgba(255,51,72,.12)}.heroName{font-size:30px;line-height:1.08;font-weight:780;letter-spacing:-.03em;text-shadow:0 2px 15px rgba(0,0,0,.8)}.heroMeta{font-size:15px;color:#c7c9ce;margin-top:7px}.heroLogo{position:absolute;right:18px;bottom:24px;z-index:3;width:48px;height:48px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.92);padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.28)}.status{position:absolute;top:10px;left:12px;z-index:5;max-width:70%;padding:6px 9px;border-radius:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(9px);font-size:10px;color:#cfd2d8;opacity:0;transition:opacity .18s}.status.show{opacity:1}.status.error{color:#ff9aa4}.homeSections{background:#000}.favoritesPanel{background:#1a1d22;border-radius:0 0 24px 24px;padding:23px 0 26px;overflow:hidden}.sectionHead{display:flex;align-items:center;justify-content:space-between;padding:0 22px;margin-bottom:17px}.sectionTitle{font-size:25px;font-weight:730;letter-spacing:-.025em}.sectionMeta{font-size:12px;color:#8d9198}.favoriteRail{display:flex;gap:12px;overflow-x:auto;padding:0 22px 12px;scrollbar-width:none;scroll-snap-type:x proximity}.favoriteRail::-webkit-scrollbar{display:none}.favCard{position:relative;flex:0 0 112px;height:112px;border-radius:23px;border:1px solid #343841;background:#1d2025;display:grid;place-items:center;padding:14px;scroll-snap-align:start;color:#fff}.favCard.active{background:#3b3e43;border-color:#4b5058;box-shadow:0 10px 22px rgba(0,0,0,.22)}.favCard.active:after{content:"";position:absolute;right:12px;top:10px;width:8px;height:8px;border-radius:50%;background:#8dc9ff}.favLogo{max-width:78px;max-height:58px;object-fit:contain}.favFallback{font-size:14px;text-align:center;font-weight:700;line-height:1.15}.primaryAction{display:block;margin:11px 22px 0 auto;border:0;border-radius:999px;background:#f7f7f7;color:#3c3d40;font-size:15px;font-weight:760;letter-spacing:.02em;padding:14px 25px}.primaryAction:active{transform:scale(.985)}.browse{padding:26px 18px 20px;background:#050607}.browseHeader{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.browseTitle{font-size:27px;font-weight:760;letter-spacing:-.03em}.count{font-size:12px;color:#777c84}.searchRow{display:flex;gap:10px;margin-bottom:12px}.searchRow input{width:100%;height:47px;border:1px solid #2d3137;border-radius:15px;background:#171a1f;color:#fff;padding:0 15px;font-size:15px;outline:none}.searchRow input:focus{border-color:#6abef1;box-shadow:0 0 0 3px rgba(106,190,241,.12)}.groupRail{display:flex;gap:8px;overflow-x:auto;padding:0 0 15px;scrollbar-width:none}.groupRail::-webkit-scrollbar{display:none}.groupChip{flex:0 0 auto;border:1px solid #31353c;background:#15181d;color:#c5c8ce;border-radius:999px;padding:9px 13px;font-size:12px}.groupChip.active{background:#f1f2f3;color:#18191c;border-color:#f1f2f3;font-weight:700}.channelGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.channel{min-width:0;border:1px solid #282c32;background:#171a1f;color:#fff;border-radius:17px;min-height:88px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left}.channel.active{background:#34373d;border-color:#51555c}.channelLogo{width:54px;height:48px;object-fit:contain;flex:0 0 auto}.channelInfo{min-width:0}.channelName{font-size:13px;font-weight:740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channelGroup{font-size:10px;color:#8f949d;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#1a1d22;border-top:1px solid #24272d;padding:8px 8px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.navItem{border:0;background:transparent;color:#8c9098;min-width:0;padding:3px 2px 0;font-size:10px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:4px}.navIcon{height:29px;min-width:36px;border-radius:20px;display:grid;place-items:center;font-size:22px;line-height:1}.navItem.active{color:#fff}.navItem.active .navIcon{background:#686c74;padding:0 15px}.emptyFav{padding:0 22px;color:#9da1a8;font-size:13px}@media(min-width:700px){body{padding-bottom:0}.shell{padding:0 18px}.appHeader{border-radius:0 0 20px 20px}.hero{border-radius:22px;margin-top:10px}.favoritesPanel{margin-top:14px;border-radius:24px}.bottomNav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,94vw);border-radius:24px 24px 0 0}.channelGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.favCard{flex-basis:126px;height:126px}}@media(orientation:landscape) and (max-height:620px){body{padding-bottom:0;background:#000}.shell{max-width:none;padding:0}.appHeader,.homeSections,.bottomNav{display:none}.hero{position:fixed;inset:0;border-radius:0;margin:0;z-index:50}.hero live-video-player,.hero live-video-skin{width:100%;height:100vh}.hero live-video-skin{aspect-ratio:auto}.heroInfo{left:6.5vw;bottom:8vh}.heroName{font-size:28px}.heroLogo{right:6vw;bottom:8vh}.status{top:14px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="shell" id="home">
  <header class="appHeader">
    <div class="headerLeft"><div class="avatar" aria-hidden="true">●</div><div class="pageTitle">Para Si</div></div>
    <div class="headerActions"><button id="fullscreenBtn" class="iconBtn" aria-label="Ecrã inteiro">▣</button><button id="favoriteBtn" class="iconBtn" aria-label="Favorito">♡</button></div>
  </header>
  <section class="hero" id="hero">
    <live-video-player id="livePlayer"><live-video-skin><video id="video" playsinline></video></live-video-skin></live-video-player>
    <div class="heroShade"></div>
    <div class="heroInfo"><div class="livePill"><span class="liveDot"></span>Em direto</div><div id="nowName" class="heroName">Escolhe um canal</div><div id="nowMeta" class="heroMeta">M3UPT · LiveTV</div></div>
    <img id="nowLogo" class="heroLogo" alt="" hidden>
    <div id="status" class="status">Pronto.</div>
  </section>
  <main class="homeSections">
    <section class="favoritesPanel" id="favoritesSection">
      <div class="sectionHead"><div class="sectionTitle">Os Meus Canais</div><div id="favoriteCount" class="sectionMeta"></div></div>
      <div id="favoritesRail" class="favoriteRail"></div>
      <button id="allChannelsBtn" class="primaryAction">TODOS OS CANAIS</button>
    </section>
    <section class="browse" id="channelsSection">
      <div class="browseHeader"><div class="browseTitle">Canais</div><div id="summary" class="count">A carregar…</div></div>
      <div class="searchRow"><input id="search" placeholder="Pesquisar canal" autocomplete="off" inputmode="search"></div>
      <div id="groupRail" class="groupRail" aria-label="Grupos de canais"></div>
      <div id="list" class="channelGrid"></div>
    </section>
  </main>
</div>
<nav class="bottomNav" aria-label="Navegação">
  <button class="navItem active" data-nav="home"><span class="navIcon">▰</span><span>Para Si</span></button>
  <button class="navItem" data-nav="zap"><span class="navIcon">▤</span><span>Zapping</span></button>
  <button class="navItem" data-nav="channels"><span class="navIcon">▶</span><span>Explorar</span></button>
  <button class="navItem" data-nav="favorites"><span class="navIcon">♥</span><span>Favoritos</span></button>
  <button class="navItem" data-nav="search"><span class="navIcon">⌕</span><span>Pesquisa</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
